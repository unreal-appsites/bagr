<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Bagr</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { background: var(--ink); }
  .login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    color: var(--paper);
  }
  .mark {
    font-family: var(--display);
    font-size: 2.2rem;
    margin-bottom: 0.5rem;
  }
  .mark .dot { color: var(--amber); }
  .tag {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--paper-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 3rem;
  }
  .login-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 2.5rem 2rem;
    max-width: 380px;
    width: 100%;
  }
  .login-card h1 { font-size: 1.4rem; margin-bottom: 0.6rem; }
  .login-card p { color: var(--slate); font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.5; }
  .github-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    padding: 0.9rem 1.25rem;
    border-radius: var(--radius);
    border: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-weight: 600;
    font-size: 0.95rem;
  }
  .github-btn:hover { background: var(--ink-soft); }
  .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.5rem 0; font-family: var(--mono); font-size: 0.7rem; color: var(--slate); text-transform: uppercase; letter-spacing: 0.08em; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .magic-form { display: flex; flex-direction: column; gap: 0.75rem; text-align: left; }
  .magic-form label { font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; color: var(--slate); }
  .magic-form input { padding: 0.7rem; border: 2px solid var(--ink); border-radius: var(--radius); font-family: var(--body); font-size: 0.95rem; }
  #magic-status { font-family: var(--mono); font-size: 0.8rem; margin-top: 0.5rem; }
  .back { margin-top: 2.5rem; font-family: var(--mono); font-size: 0.8rem; color: var(--paper-dim); text-decoration: none; }
  .back:hover { color: var(--amber); }
</style>
</head>
<body>

<div class="login-screen">
  <div class="mark">bagr<span class="dot">.</span></div>
  <div class="tag">manifest access</div>

  <div class="login-card">
    <h1>Sign in to Bagr</h1>
    <p>Your timetable and item list are tied to your account, so they follow you between devices.</p>
    <button class="github-btn" id="github-signin">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      Continue with GitHub
    </button>

    <div class="divider">or</div>

    <form class="magic-form" id="magic-form">
      <label for="magic-email">Email</label>
      <input type="email" id="magic-email" placeholder="you@example.com" required>
      <button type="submit" class="btn amber" style="justify-content:center;">Send magic link</button>
      <div id="magic-status"></div>
    </form>
  </div>

  <a class="back" href="index.html">← Back to Bagr</a>
</div>

<script>
  window.onerror = function(msg, url, line, col, err) {
    alert('JS ERROR: ' + msg + '\nLine: ' + line + '\nFile: ' + url);
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
  document.getElementById('github-signin').addEventListener('click', signInWithGithub);

  document.getElementById('magic-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('magic-status');
    const email = document.getElementById('magic-email').value.trim();
    status.textContent = 'Sending…';
    const error = await sendMagicLink(email);
    status.textContent = error ? `Error: ${error.message}` : `✓ Check ${email} for your link.`;
  });
</script>

</body>
</html>
