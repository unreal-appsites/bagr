<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Bagr</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { background: var(--ink); }
  .login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    color: var(--paper);
  }
  .mark {
    font-family: var(--display);
    font-size: 2.2rem;
    margin-bottom: 0.5rem;
  }
  .mark .dot { color: var(--amber); }
  .tag {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--paper-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 3rem;
  }
  .login-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 2.5rem 2rem;
    max-width: 380px;
    width: 100%;
  }
  .login-card h1 { font-size: 1.4rem; margin-bottom: 0.6rem; }
  .login-card p { color: var(--slate); font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.5; }
  .google-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    padding: 0.9rem 1.25rem;
    border-radius: var(--radius);
    border: 2px solid var(--ink);
    background: white;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .google-btn:hover { background: var(--paper-dim); }
  .back { margin-top: 2.5rem; font-family: var(--mono); font-size: 0.8rem; color: var(--paper-dim); text-decoration: none; }
  .back:hover { color: var(--amber); }
</style>
</head>
<body>

<div class="login-screen">
  <div class="mark">bagr<span class="dot">.</span></div>
  <div class="tag">manifest access</div>

  <div class="login-card">
    <h1>Sign in to Bagr</h1>
    <p>Your timetable and item list are tied to your account, so they follow you between devices.</p>
    <button class="google-btn" id="google-signin">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 013.68 9c0-.6.1-1.18.29-1.72V4.95H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.05l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 00.98 4.95l2.99 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
  </div>

  <a class="back" href="index.html">← Back to Bagr</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
  document.getElementById('google-signin').addEventListener('click', signInWithGoogle);
</script>

</body>
</html>
