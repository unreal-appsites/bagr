<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Bagr</title>
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="icon" href="logo-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bagr">
<meta name="theme-color" content="#171B24">
<link rel="stylesheet" href="shared.css">
<style>
  body { background: var(--paper); }
  .login-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.5rem; }
  .login-card { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: var(--radius); padding: 2.5rem 2rem; max-width: 420px; width: 100%; }
  .tag { font-family: var(--mono); font-size: 0.75rem; color: var(--slate); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }
  .login-card h1 { font-size: clamp(1.8rem, 5vw, 2.2rem); line-height: 1.1; margin-bottom: 1.5rem; }
  .pw-form { display: flex; flex-direction: column; gap: 0.9rem; text-align: left; }
  .pw-form label { font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; color: var(--slate); }
  .pw-form input { padding: 0.7rem; border: 2px solid var(--ink); border-radius: var(--radius); font-family: var(--body); font-size: 0.95rem; background: white; }
  #status { font-family: var(--mono); font-size: 0.8rem; margin-top: 0.25rem; }
</style>
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="tag">Reset password</div>
    <h1>Pick a new password.</h1>

    <form class="pw-form" id="reset-form">
      <div>
        <label for="new-password">New password</label>
        <input type="password" id="new-password" placeholder="At least 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="btn amber" style="justify-content:center;">Update password →</button>
      <div id="status"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js?v=3"></script>
<script>
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      document.getElementById('status').textContent = 'This reset link is invalid or expired — request a new one from the login page.';
      document.getElementById('reset-form').style.display = 'none';
    }
  })();

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('status');
    const newPassword = document.getElementById('new-password').value;
    status.textContent = 'Updating…';
    const error = await updatePassword(newPassword);
    if (error) {
      status.textContent = `Error: ${error.message}`;
    } else {
      status.textContent = '✓ Password updated — redirecting…';
      setTimeout(() => window.location.href = 'today.html', 1200);
    }
  });
</script>

</body>
</html>
