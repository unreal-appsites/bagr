<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today — Bagr</title>
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="icon" href="logo-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bagr">
<meta name="theme-color" content="#171B24">
<link rel="stylesheet" href="shared.css">
<style>
  .stub {
    background: var(--ink); color: var(--paper); border-radius: var(--radius);
    display: flex; max-width: 640px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(23,27,36,0.2); margin-bottom: 1.5rem;
  }
  .stub-main { padding: 1.5rem 1.75rem; flex: 1; }
  .stub-stub { width: 130px; padding: 1.5rem 1rem; border-left: 2px dashed var(--paper); display: flex; align-items: center; justify-content: center; }
  .stub .label { color: var(--amber); }
  .stub-day { font-family: var(--display); font-weight: 700; font-size: 1.4rem; margin: 0.3rem 0 0.9rem; }
  .pack-item { display: flex; align-items: center; gap: 0.6rem; font-family: var(--mono); font-size: 0.9rem; padding: 0.3rem 0; }
  .pack-item.have { text-decoration: line-through; opacity: 0.5; }
  .dot-missing { width: 8px; height: 8px; border-radius: 50%; background: var(--stamp); flex-shrink: 0; }
  .dot-have { width: 8px; height: 8px; border-radius: 50%; background: #4d7c4a; flex-shrink: 0; }

  .empty-state { max-width: 640px; margin-bottom: 1.5rem; }

  .notif-card { max-width: 640px; display: flex; gap: 0.9rem; align-items: flex-start; }
  .notif-card .bell { font-size: 1.2rem; }
  .notif-card h3 { font-size: 1.05rem; margin-bottom: 0.3rem; }
  .notif-card p { color: var(--slate); font-size: 0.9rem; margin: 0 0 1rem; }
  #notif-status { font-family: var(--mono); font-size: 0.8rem; margin-top: 0.75rem; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav"></nav>

  <main class="app-main">
    <p class="label" style="margin-bottom:0.6rem;">Next departure</p>
    <h1 style="font-size:2.1rem; margin-bottom:0.5rem;">What you need next</h1>
    <p style="color:var(--slate); margin-bottom:2rem;">Cross-checked against what's home right now.</p>

    <div id="stub-container"><!-- populated by JS --></div>

    <div class="card notif-card">
      <span class="bell">🔔</span>
      <div style="flex:1;">
        <h3>A gentler reminder</h3>
        <p>Enable browser notifications and pick when Bagr should tap you if something's missing for tomorrow.</p>
        <label for="notif-time" class="label" style="display:block; margin-bottom:0.4rem;">Remind me at</label>
        <select id="notif-time" style="padding:0.6rem; border:2px solid var(--ink); border-radius:var(--radius); font-family:var(--body); margin-bottom:1rem;"></select>
        <div>
          <button class="btn outline" id="enable-notif-btn" onclick="enableNotifications()">Enable notifications</button>
          <button class="btn amber" id="update-time-btn" style="display:none;" onclick="updateNotifTime()">Save time</button>
        </div>
        <div id="notif-status"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js?v=2"></script>
<script>
const VAPID_PUBLIC_KEY = 'BK_R-3kGaNHd-APrGqj8mrT-Y8xrfGMgjZSx_i7sjf2fyCr6LeppvrR__D6dcsuPHO_bQgJgLdIqyFQPb2VOqQk';
let session, slots = [], items = [];

async function init() {
  session = await requireSession();
  if (!session) return;
  renderDrawerNav('today');
  const userId = session.user.id;
  [slots, items] = await Promise.all([fetchSlots(userId), fetchItems(userId)]);
  render();
  populateTimeOptions();
  await reflectNotifPermission();
}

function populateTimeOptions() {
  const select = document.getElementById('notif-time');
  const opts = [];
  for (let h = 0; h < 24; h++) {
    const d = new Date();
    d.setHours(h, 0, 0, 0);
    const label = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    opts.push(`<option value="${h}">${label}</option>`);
  }
  select.innerHTML = opts.join('');
  select.value = 19; // default 7pm local until we know otherwise
}

function localHourToUtcHour(localHour) {
  const d = new Date();
  d.setHours(localHour, 0, 0, 0);
  return d.getUTCHours();
}

function utcHourToLocalHour(utcHour) {
  const d = new Date();
  d.setUTCHours(utcHour, 0, 0, 0);
  return d.getHours();
}

function render() {
  const todayIdx = (new Date().getDay() + 6) % 7; // Mon=0
  const container = document.getElementById('stub-container');

  // Find the next 1-2 upcoming days that have slots
  const upcoming = [];
  for (let offset = 1; offset <= 7 && upcoming.length < 2; offset++) {
    const dayIdx = (todayIdx + offset) % 7;
    const daySlots = slots.filter(s => s.day_of_week === dayIdx);
    if (daySlots.length) upcoming.push({ dayIdx, daySlots, label: nextOccurrenceLabel(dayIdx) });
  }

  if (!upcoming.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📦</div>
        <h3>Your week is still open.</h3>
        <p>Build out your timetable and the next things to pack will appear here.</p>
        <a class="btn" href="timetable.html">Build timetable →</a>
      </div>`;
    return;
  }

  container.innerHTML = upcoming.map(({ dayIdx, daySlots, label }) => {
    const needed = itemsNeededForDay(slots, items, dayIdx);
    const rows = needed.length
      ? needed.map(item => `
          <div class="pack-item ${item.location === 'home' ? '' : 'have'}">
            <span class="${item.location === 'home' ? 'dot-missing' : 'dot-have'}"></span>
            ${item.name} ${item.location === 'home' ? '— grab it' : '— already in bag'}
          </div>`).join('')
      : `<div class="pack-item">No items linked to these slots yet</div>`;

    return `
      <div class="stub">
        <div class="stub-main">
          <div class="label">${label.toLowerCase()}</div>
          <div class="stub-day">${daySlots.map(s => s.label).join(' · ')}</div>
          ${rows}
        </div>
        <div class="stub-stub">
          <span class="label" style="writing-mode:vertical-rl;">BAGR</span>
        </div>
      </div>`;
  }).join('');
}

async function reflectNotifPermission() {
  const status = document.getElementById('notif-status');
  const enableBtn = document.getElementById('enable-notif-btn');
  const updateBtn = document.getElementById('update-time-btn');
  const select = document.getElementById('notif-time');

  if (!('Notification' in window)) {
    status.textContent = 'Notifications aren\'t supported in this browser.';
    enableBtn.style.display = 'none';
    return;
  }

  if (Notification.permission === 'denied') {
    status.textContent = 'Blocked — enable notifications for this site in your browser settings.';
    enableBtn.style.display = 'none';
    return;
  }

  if (Notification.permission === 'granted') {
    // Already granted — check if we actually have a saved subscription + time
    const { data: existing } = await sb.from('push_subscriptions')
      .select('notify_hour').eq('user_id', session.user.id).maybeSingle();
    if (existing) {
      select.value = utcHourToLocalHour(existing.notify_hour);
      enableBtn.style.display = 'none';
      updateBtn.style.display = '';
      status.textContent = '✓ Notifications enabled.';
      return;
    }
    // Permission granted but never actually subscribed (e.g. cleared DB) — let them (re)subscribe
    enableBtn.textContent = 'Save & subscribe';
  }
}

async function enableNotifications() {
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') { reflectNotifPermission(); return; }

  if ('serviceWorker' in navigator) {
    const reg = await navigator.serviceWorker.register('sw.js');
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    const localHour = parseInt(document.getElementById('notif-time').value, 10);
    await sb.from('push_subscriptions').upsert({
      user_id: session.user.id,
      subscription: sub.toJSON(),
      notify_hour: localHourToUtcHour(localHour)
    });
  }
  reflectNotifPermission();
}

async function updateNotifTime() {
  const status = document.getElementById('notif-status');
  const localHour = parseInt(document.getElementById('notif-time').value, 10);
  const { error } = await sb.from('push_subscriptions')
    .update({ notify_hour: localHourToUtcHour(localHour) })
    .eq('user_id', session.user.id);
  status.textContent = error ? `Error: ${error.message}` : '✓ Reminder time updated.';
}

// Converts the VAPID public key into the byte format pushManager.subscribe expects
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

init();
</script>
</body>
</html>
