<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today — Bagr</title>
<link rel="stylesheet" href="shared.css">
<style>
  .stub {
    background: var(--ink); color: var(--paper); border-radius: var(--radius);
    display: flex; max-width: 640px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(20,24,31,0.2); margin-bottom: 2rem;
  }
  .stub-main { padding: 1.5rem 1.75rem; flex: 1; }
  .stub-stub { width: 130px; padding: 1.5rem 1rem; border-left: 2px dashed var(--paper); display: flex; align-items: center; justify-content: center; }
  .stub .label { color: var(--amber); }
  .stub-day { font-family: var(--display); font-size: 1.4rem; margin: 0.3rem 0 0.9rem; }
  .pack-item { display: flex; align-items: center; gap: 0.6rem; font-family: var(--mono); font-size: 0.9rem; padding: 0.3rem 0; }
  .pack-item.have { text-decoration: line-through; opacity: 0.5; }
  .dot-missing { width: 8px; height: 8px; border-radius: 50%; background: var(--stamp); flex-shrink: 0; }
  .dot-have { width: 8px; height: 8px; border-radius: 50%; background: #4d7c4a; flex-shrink: 0; }
  .empty-state { color: var(--slate); }

  .notif-card { max-width: 640px; }
  .notif-card p { color: var(--slate); font-size: 0.9rem; margin: 0.5rem 0 1rem; }
  #notif-status { font-family: var(--mono); font-size: 0.8rem; margin-top: 0.75rem; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav">
    <strong>bagr.</strong>
    <div class="links">
      <a href="timetable.html">Timetable</a>
      <a href="items.html">Items</a>
      <a href="today.html" class="active">Today</a>
      <a href="#" onclick="signOut()">Sign out</a>
    </div>
  </nav>

  <main class="app-main">
    <h1 style="font-size:1.8rem; margin-bottom:0.4rem;">What you need next</h1>
    <p class="label" style="margin-bottom:2rem;">cross-checked against what's home right now</p>

    <div id="stub-container"><!-- populated by JS --></div>

    <div class="card notif-card">
      <h3 style="font-size:1.1rem;">Reminders</h3>
      <p>Get a browser notification the evening before something's due, so this page doesn't have to be a habit.</p>
      <button class="btn amber" id="enable-notif-btn" onclick="enableNotifications()">Enable notifications</button>
      <div id="notif-status"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
let session, slots = [], items = [];

async function init() {
  session = await requireSession();
  if (!session) return;
  const userId = session.user.id;
  [slots, items] = await Promise.all([fetchSlots(userId), fetchItems(userId)]);
  render();
  reflectNotifPermission();
}

function render() {
  const todayIdx = (new Date().getDay() + 6) % 7; // Mon=0
  const container = document.getElementById('stub-container');

  // Find the next 1-2 upcoming days that have slots
  const upcoming = [];
  for (let offset = 1; offset <= 7 && upcoming.length < 2; offset++) {
    const dayIdx = (todayIdx + offset) % 7;
    const daySlots = slots.filter(s => s.day_of_week === dayIdx);
    if (daySlots.length) upcoming.push({ dayIdx, daySlots, label: nextOccurrenceLabel(dayIdx) });
  }

  if (!upcoming.length) {
    container.innerHTML = `<p class="empty-state">No upcoming slots yet — build out your <a href="timetable.html">timetable</a> to see pack lists here.</p>`;
    return;
  }

  container.innerHTML = upcoming.map(({ dayIdx, daySlots, label }) => {
    const needed = itemsNeededForDay(slots, items, dayIdx);
    const rows = needed.length
      ? needed.map(item => `
          <div class="pack-item ${item.location === 'home' ? '' : 'have'}">
            <span class="${item.location === 'home' ? 'dot-missing' : 'dot-have'}"></span>
            ${item.name} ${item.location === 'home' ? '— grab it' : '— already in bag'}
          </div>`).join('')
      : `<div class="pack-item">No items linked to these slots yet</div>`;

    return `
      <div class="stub">
        <div class="stub-main">
          <div class="label">${label.toLowerCase()}</div>
          <div class="stub-day">${daySlots.map(s => s.label).join(' · ')}</div>
          ${rows}
        </div>
        <div class="stub-stub">
          <span class="label" style="writing-mode:vertical-rl;">BAGR</span>
        </div>
      </div>`;
  }).join('');
}

function reflectNotifPermission() {
  const status = document.getElementById('notif-status');
  const btn = document.getElementById('enable-notif-btn');
  if (!('Notification' in window)) {
    status.textContent = 'Notifications aren\'t supported in this browser.';
    btn.style.display = 'none';
    return;
  }
  if (Notification.permission === 'granted') {
    status.textContent = '✓ Notifications enabled.';
    btn.style.display = 'none';
  } else if (Notification.permission === 'denied') {
    status.textContent = 'Blocked — enable notifications for this site in your browser settings.';
    btn.style.display = 'none';
  }
}

async function enableNotifications() {
  const permission = await Notification.requestPermission();
  reflectNotifPermission();
  if (permission !== 'granted') return;

  // Register service worker + subscribe to push.
  // Requires VAPID keys + a sw.js — see README for setup.
  if ('serviceWorker' in navigator) {
    const reg = await navigator.serviceWorker.register('sw.js');
    // const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: VAPID_PUBLIC_KEY });
    // await sb.from('push_subscriptions').upsert({ user_id: session.user.id, subscription: sub });
  }
}

init();
</script>
</body>
</html>
