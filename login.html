<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Bagr</title>
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="icon" href="logo-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bagr">
<meta name="theme-color" content="#171B24">
<link rel="stylesheet" href="shared.css?v=4">
<style>
  body { background: var(--paper); }
  .login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }
  .login-card {
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    padding: 2.5rem 2rem;
    max-width: 420px;
    width: 100%;
  }
  .tag {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
  }
  .login-card h1 {
    font-size: clamp(2rem, 6vw, 2.6rem);
    line-height: 1.05;
    margin-bottom: 2rem;
  }
  .github-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    padding: 0.9rem 1.25rem;
    border-radius: var(--radius);
    border: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-weight: 600;
    font-size: 0.95rem;
  }
  .github-btn:hover { background: var(--paper-dim); }
  .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.5rem 0; font-family: var(--mono); font-size: 0.7rem; color: var(--slate); text-transform: uppercase; letter-spacing: 0.08em; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .magic-form { display: flex; flex-direction: column; gap: 0.75rem; text-align: left; }
  .magic-form label { font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; color: var(--slate); }
  .magic-form input { padding: 0.7rem; border: 2px solid var(--ink); border-radius: var(--radius); font-family: var(--body); font-size: 0.95rem; background: white; }
  #magic-status { font-family: var(--mono); font-size: 0.8rem; margin-top: 0.5rem; }
  .tabs { display: flex; gap: 1.5rem; border-bottom: 2px solid var(--line); margin-bottom: 1.5rem; }
  .tab-btn { background: none; border: none; padding: 0 0 0.75rem; font-family: var(--body); font-weight: 600; font-size: 0.95rem; color: var(--slate); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--amber); }
  .pw-form { display: flex; flex-direction: column; gap: 0.9rem; text-align: left; margin-bottom: 0.5rem; }
  .pw-form label { font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; color: var(--slate); }
  .pw-form input { padding: 0.7rem; border: 2px solid var(--ink); border-radius: var(--radius); font-family: var(--body); font-size: 0.95rem; background: white; }
  #pw-status { font-family: var(--mono); font-size: 0.8rem; margin-top: 0.25rem; }
  .disclaimer { font-family: var(--mono); font-size: 0.75rem; color: var(--slate); text-align: center; margin-top: 1.75rem; line-height: 1.5; }
  .back { display: block; margin-top: 2rem; font-family: var(--mono); font-size: 0.8rem; color: var(--slate); text-decoration: none; text-align: center; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="tag">Manifest access</div>
    <h1>Your week,<br>in one bag.</h1>

    <div class="tabs">
      <button class="tab-btn active" id="tab-signin" onclick="setMode('signin')">Sign in</button>
      <button class="tab-btn" id="tab-signup" onclick="setMode('signup')">Create account</button>
    </div>

    <form class="pw-form" id="pw-form">
      <div>
        <label for="pw-email">Email</label>
        <input type="email" id="pw-email" placeholder="you@example.com" required>
      </div>
      <div>
        <label for="pw-password">Password</label>
        <input type="password" id="pw-password" placeholder="At least 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="btn amber" style="justify-content:center;" id="pw-submit">Sign in →</button>
      <div id="pw-status"></div>
      <button type="button" id="forgot-link" style="background:none; border:none; color:var(--slate); font-family:var(--mono); font-size:0.75rem; text-decoration:underline; cursor:pointer; align-self:flex-start; padding:0;">Forgot password?</button>
    </form>

    <form class="pw-form" id="reset-form" style="display:none;">
      <p style="font-size:0.85rem; color:var(--slate); margin:0;">Enter your email and we'll send a reset link.</p>
      <div>
        <label for="reset-email">Email</label>
        <input type="email" id="reset-email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn outline" style="justify-content:center;">Send reset link →</button>
      <div id="reset-status"></div>
      <button type="button" id="back-to-signin" style="background:none; border:none; color:var(--slate); font-family:var(--mono); font-size:0.75rem; text-decoration:underline; cursor:pointer; align-self:flex-start; padding:0;">Back to sign in</button>
    </form>

    <div class="divider">or</div>

    <button class="github-btn" id="github-signin">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      Continue with GitHub
    </button>

    <div class="divider">or</div>

    <form class="magic-form" id="magic-form">
      <label for="magic-email">Email</label>
      <input type="email" id="magic-email" placeholder="you@example.com" required>
      <button type="submit" class="btn outline" style="justify-content:center;">Send magic link →</button>
      <div id="magic-status"></div>
    </form>

    <div class="disclaimer">By continuing, you agree to keep your manifest yours.</div>
  </div>

  <a class="back" href="index.html">← Back to Bagr</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js?v=4"></script>
<script>
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = 'today.html';
  })();

  if (new URLSearchParams(window.location.search).get('mode') === 'signup') {
    setMode('signup');
  }

  document.getElementById('github-signin').addEventListener('click', signInWithGithub);

  document.getElementById('forgot-link').addEventListener('click', () => {
    document.getElementById('pw-form').style.display = 'none';
    document.getElementById('reset-form').style.display = 'flex';
  });
  document.getElementById('back-to-signin').addEventListener('click', () => {
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('pw-form').style.display = 'flex';
  });

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('reset-status');
    const email = document.getElementById('reset-email').value.trim();
    status.textContent = 'Sending…';
    const error = await sendPasswordReset(email);
    status.textContent = error ? `Error: ${error.message}` : `✓ Check ${email} for your reset link.`;
  });
  let authMode = 'signin';
  function setMode(mode) {
    authMode = mode;
    document.getElementById('tab-signin').classList.toggle('active', mode === 'signin');
    document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
    document.getElementById('pw-submit').textContent = mode === 'signin' ? 'Sign in →' : 'Create account →';
    document.getElementById('pw-status').textContent = '';
  }

  document.getElementById('pw-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('pw-status');
    const email = document.getElementById('pw-email').value.trim();
    const password = document.getElementById('pw-password').value;
    status.textContent = authMode === 'signin' ? 'Signing in…' : 'Creating account…';
    const error = authMode === 'signin'
      ? await signInWithPassword(email, password)
      : await signUpWithPassword(email, password);
    if (error) {
      status.textContent = `Error: ${error.message}`;
    } else if (authMode === 'signin') {
      window.location.href = 'today.html';
    } else {
      status.textContent = '✓ Account created — check your email to confirm, then sign in.';
    }
  });

  document.getElementById('magic-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('magic-status');
    const email = document.getElementById('magic-email').value.trim();
    status.textContent = 'Sending…';
    const error = await sendMagicLink(email);
    status.textContent = error ? `Error: ${error.message}` : `✓ Check ${email} for your link.`;
  });
</script>

</body>
</html>
